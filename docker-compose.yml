services:
  cartable:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartable-numerique
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    volumes:
      # Persistance des données (comptes étudiants, bases SQLite/JSON, sessions chiffrées, uploads)
      - ./data:/app/data
    networks:
      - default
      - plaudtodocs_qnote
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cartable-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - default
      - plaudtodocs_qnote
    depends_on:
      - cartable

networks:
  plaudtodocs_qnote:
    external: true
